<style>
body{margin:0;background:#FFF4EA;font-family:Nunito,system-ui,sans-serif;color:#3B1F14}
button{font-family:Nunito,system-ui,sans-serif}
a{color:#C2410C}a:hover{color:#7C2D12}
@keyframes lppBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes lppPop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.lpp-bob{animation:lppBob 4.5s ease-in-out infinite}
.lpp-bubble{animation:lppPop .35s ease-out both}
.lpp-btn{transition:transform .2s ease}
.lpp-btn:hover{transform:translateY(-2px)}
.lpp-card{transition:transform .25s ease}
.lpp-card:hover{transform:translateY(-4px)}
@media (prefers-reduced-motion: reduce){.lpp-bob,.lpp-bubble{animation:none}}
@keyframes lppWalk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes lppTalk{0%,100%{transform:rotate(0deg) translateY(0)}25%{transform:rotate(-1.6deg) translateY(-3px)}75%{transform:rotate(1.6deg) translateY(-1px)}}
@keyframes lppIdle{0%,100%{transform:scale(1,1) rotate(0deg)}50%{transform:scale(1.012,1.02) rotate(.6deg)}}
@keyframes lppEnter{0%{transform:translateX(140px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes lppWave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-2.5deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1.5deg)}}
.lpp-walk{animation:lppWalk .42s ease-in-out infinite;transform-origin:50% 100%}
.lpp-talk{animation:lppTalk .55s ease-in-out infinite;transform-origin:50% 100%}
.lpp-idle{animation:lppIdle 3.2s ease-in-out infinite;transform-origin:50% 100%}

.lpp-wave{animation:lppWave 2.6s ease-in-out 1.2s infinite;transform-origin:50% 100%}
@media (prefers-reduced-motion: reduce){.lpp-walk,.lpp-talk,.lpp-idle,.lpp-enter,.lpp-wave{animation:none}}

/* ===== Capa visual tecnológica ===== */
@keyframes lppAsk{0%{box-shadow:0 0 0 0 rgba(255,209,102,.9),0 6px 0 #160A05}70%{box-shadow:0 0 0 16px rgba(255,209,102,0),0 6px 0 #160A05}100%{box-shadow:0 0 0 0 rgba(255,209,102,0),0 6px 0 #160A05}}
.lpp-ask{animation:lppAsk 1.4s ease-out infinite}
@keyframes lppEngine{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-3px) rotate(-.4deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(-2px) rotate(.4deg)}}
.lpp-engine{animation:lppEngine .9s ease-in-out infinite;transform-origin:50% 90%}
@keyframes lppDriveIn{from{translate:70% 0;opacity:0}60%{opacity:1}to{translate:0 0;opacity:1}}
@supports (animation-timeline: view()){.lpp-drive-in{animation:lppDriveIn linear both;animation-timeline:view();animation-range:entry 0% entry 85%}}
@media (prefers-reduced-motion: reduce){.lpp-engine,.lpp-drive-in{animation:none!important}}
@keyframes lppWaPulse{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #0D4425,0 0 0 0 rgba(37,192,99,.7)}70%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #0D4425,0 0 0 22px rgba(37,192,99,0)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #0D4425,0 0 0 0 rgba(37,192,99,0)}}
.lpp-wa-round{animation:lppWaPulse 1.8s ease-out infinite}
.lpp-wa-round:hover{animation-play-state:paused}
#lpp-wa-float.lpp-spot{position:fixed!important;scale:1.18}
@keyframes lppWaJump{0%,100%{translate:0 0}30%{translate:0 -16px}50%{translate:0 0}65%{translate:0 -7px}80%{translate:0 0}}
@keyframes lppWaRing{0%{box-shadow:0 0 0 0 rgba(37,211,102,.65)}100%{box-shadow:0 0 0 26px rgba(37,211,102,0)}}
#lpp-wa-float.lpp-wa-attn{animation:lppWaJump 1.1s ease-in-out infinite,lppWaRing 1.1s ease-out infinite!important;scale:1.22}
@keyframes lppTourIn{from{opacity:0;translate:-50% -10px}to{opacity:1;translate:-50% 0}}
.lpp-tourbar{animation:lppTourIn .4s ease-out both}
#lpp-wa-tag{position:fixed;right:10px;bottom:104px;z-index:33;background:#3B1F14;color:#FFF4EA;font:800 15px/1 Nunito,system-ui,sans-serif;padding:11px 15px;border-radius:999px;box-shadow:0 12px 24px -12px rgba(59,31,20,.7);white-space:nowrap;pointer-events:none;opacity:0;translate:0 10px;transition:opacity .3s ease,translate .3s ease}
#lpp-wa-tag::after{content:"";position:absolute;right:30px;bottom:-6px;width:12px;height:12px;background:#3B1F14;rotate:45deg;border-radius:2px}
#lpp-wa-tag.on{opacity:1;translate:0 0}
@keyframes lppSpotRing{0%{box-shadow:0 0 0 4px #FF7AAC,0 0 0 10px rgba(255,122,172,.35),0 30px 60px -20px rgba(217,72,28,.6)}50%{box-shadow:0 0 0 4px #FF7AAC,0 0 0 22px rgba(255,122,172,0),0 30px 60px -20px rgba(217,72,28,.6)}100%{box-shadow:0 0 0 4px #FF7AAC,0 0 0 10px rgba(255,122,172,.35),0 30px 60px -20px rgba(217,72,28,.6)}}
.lpp-spot{position:relative;z-index:6;scale:1.035;transition:scale .35s cubic-bezier(.2,.8,.2,1);animation:lppSpotRing 1.4s ease-in-out infinite!important}
.lpp-spot-img{filter:drop-shadow(0 0 18px rgba(255,122,172,.95)) drop-shadow(0 0 4px #FF7AAC);scale:1.05;transition:scale .35s ease,filter .35s ease}

.logo3d{transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;filter:drop-shadow(0 6px 10px rgba(59,31,20,.12))}
.logo3d:hover{transform:translateY(-2px) scale(1.04);filter:drop-shadow(0 10px 14px rgba(59,31,20,.18))}
@keyframes lppLogo{0%,100%{transform:perspective(600px) rotateX(6deg) rotateY(-5deg)}50%{transform:perspective(600px) rotateX(4deg) rotateY(5deg)}}

@property --lppA{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes lppSpin{to{--lppA:360deg}}
@keyframes lppRise{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:.9}100%{transform:translateY(-620px) scale(1.1);opacity:0}}
@keyframes lppOrb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.15)}}
@keyframes lppMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes lppPulse{0%{box-shadow:0 0 0 0 rgba(217,72,28,.55)}100%{box-shadow:0 0 0 10px rgba(217,72,28,0)}}
@keyframes lppShine{0%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes lppFloatChip{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(var(--r,0deg))}}
@keyframes lppDash{to{background-position:0 40px}}
@keyframes lppType{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes lppRvIn{from{opacity:0;translate:0 36px;scale:.98}to{opacity:1;translate:0 0;scale:1}}

.lpp-dots{background-image:radial-gradient(rgba(59,31,20,.09) 1.2px,transparent 1.3px);background-size:22px 22px}
.lpp-dots-light{background-image:radial-gradient(rgba(255,255,255,.22) 1.2px,transparent 1.3px);background-size:22px 22px}
.lpp-grid-light{background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:44px 44px}

/* botones 3D */
.b3d{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-family:Nunito,sans-serif;font-weight:800;border:none;border-radius:999px;cursor:pointer;transform:translateY(0);transition:transform .15s ease,box-shadow .15s ease,filter .2s ease;white-space:nowrap}
.b3d::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%) skewX(-20deg);z-index:-1;pointer-events:none}
.b3d:hover::after{animation:lppShine .9s ease}
.b3d:hover{transform:translateY(-2px);filter:saturate(1.08)}
.b3d:active{transform:translateY(4px)}
.b3d:focus-visible{outline:3px solid #8E7CF0;outline-offset:3px}
.b3d-dark{background:linear-gradient(180deg,#5A3424 0%,#3B1F14 55%,#2C160D 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 0 #160A05,0 16px 26px -10px rgba(59,31,20,.7)}
.b3d-dark:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 0 #160A05,0 20px 30px -10px rgba(59,31,20,.7)}
.b3d-dark:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 #160A05,0 6px 12px -6px rgba(59,31,20,.7)}
.b3d-white{background:linear-gradient(180deg,#FFFFFF 0%,#FFF4EC 100%);color:#3B1F14;box-shadow:inset 0 1px 0 #fff,0 6px 0 #E3BBA4,0 16px 26px -12px rgba(59,31,20,.45)}
.b3d-white:hover{box-shadow:inset 0 1px 0 #fff,0 8px 0 #E3BBA4,0 20px 30px -12px rgba(59,31,20,.45)}
.b3d-white:active{box-shadow:inset 0 1px 0 #fff,0 2px 0 #E3BBA4,0 6px 12px -6px rgba(59,31,20,.4)}
.b3d-orange{background:linear-gradient(180deg,#F27247 0%,#D9481C 60%,#C23C14 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 0 #8E2A0E,0 16px 26px -10px rgba(217,72,28,.6)}
.b3d-orange:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 0 #8E2A0E,0 20px 30px -10px rgba(217,72,28,.6)}
.b3d-orange:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #8E2A0E,0 6px 12px -6px rgba(217,72,28,.6)}
.b3d-green{background:linear-gradient(180deg,#2FB26A 0%,#1E7F46 70%,#196B3B 100%);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 0 #0D4425,0 16px 26px -10px rgba(30,127,70,.6)}
.b3d-green:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 0 #0D4425,0 20px 30px -10px rgba(30,127,70,.6)}
.b3d-green:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0D4425,0 6px 12px -6px rgba(30,127,70,.6)}
.b3d-sq{border-radius:14px}

/* tarjetas */
.glass{background:linear-gradient(180deg,#FFFFFF,#FFFAF6) padding-box,linear-gradient(140deg,rgba(255,122,172,.55),rgba(255,197,158,.35) 40%,rgba(142,124,240,.45)) border-box;border:1.5px solid transparent;box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(59,31,20,.04),0 22px 44px -26px rgba(59,31,20,.38);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease}
.glass:hover{transform:perspective(900px) rotateX(3deg) rotateY(-3deg) translateY(-6px);box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(59,31,20,.04),0 34px 60px -28px rgba(142,124,240,.55),0 0 0 4px rgba(255,122,172,.12)}
.tile3d{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(59,31,20,.12),0 8px 14px -8px rgba(59,31,20,.5)}
.sphere{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 8%,transparent 30%),var(--c,#FF7AAC);box-shadow:inset 0 -6px 10px rgba(0,0,0,.18),0 10px 18px -8px rgba(59,31,20,.6)}
.neon{position:relative;isolation:isolate}
.neon::before{content:"";position:absolute;inset:-3px;padding:3px;border-radius:inherit;background:conic-gradient(from var(--lppA),#FF7AAC,#8E7CF0,#FFC59E,#D9481C,#FF7AAC);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none;animation:lppSpin 6s linear infinite}
.neon{box-shadow:0 30px 60px -30px rgba(142,124,240,.55),0 0 40px -10px rgba(255,122,172,.45)!important}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.8px;text-transform:uppercase;background:rgba(255,255,255,.75);border:1px solid rgba(217,72,28,.25);color:#C23C14;backdrop-filter:blur(8px)}
.chip i{width:8px;height:8px;border-radius:50%;background:#D9481C;animation:lppPulse 1.6s ease-out infinite}
.chip-dark{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#FFC9DD}
.chip-dark i{background:#FFD166}
.bubble-soap{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,.25) 18%,rgba(255,255,255,.08) 55%,rgba(255,255,255,.35) 70%,transparent 72%);border:1px solid rgba(255,255,255,.55);animation:lppRise linear infinite;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:lppOrb 12s ease-in-out infinite;pointer-events:none}
.float-chip{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 30px -18px rgba(59,31,20,.6);font-weight:800;animation:lppFloatChip 5s ease-in-out infinite}
.marquee{display:flex;width:max-content;animation:lppMarquee 32s linear infinite}
.marquee:hover{animation-play-state:paused}
.steps-line{position:absolute;left:49px;top:40px;bottom:40px;width:3px;border-radius:3px;background:repeating-linear-gradient(180deg,#FF7AAC 0 10px,transparent 10px 20px);background-size:3px 40px;animation:lppDash 1.2s linear infinite;opacity:.7}
.phone3d{transform:perspective(1200px) rotateY(-14deg) rotateX(4deg);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.phone3d:hover{transform:perspective(1200px) rotateY(-4deg) rotateX(1deg)}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#8A8A8A;animation:lppType 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.stat-num{background:linear-gradient(180deg,#FFFFFF,#FF9DC2);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow-top{position:relative}
.glow-top::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#FF7AAC,#8E7CF0,#FFC59E,transparent)}
.header-glass{background:rgba(255,244,234,.78)!important;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
.nav-link{position:relative}
.nav-link::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:#D9481C;transform:scaleX(0);transition:transform .25s ease}
.nav-link:hover::after{transform:scaleX(1)}
@supports (animation-timeline: view()){
  .rv{animation:lppRvIn linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
}
@media (prefers-reduced-motion: reduce){.bubble-soap,.orb,.float-chip,.marquee,.steps-line,.neon::before,.neon::after,.chip i,.rv,.logo3d{animation:none!important}.b3d:hover::after{animation:none}}
@media (max-width: 860px){.lpp-guide-inner{zoom:.62}.lpp-guide-img{height:150px !important}.float-chip{display:none}.phone3d{transform:none}}

@media (max-width: 860px){
  .lpp-nav-links{display:none !important}
  .lpp-h1{font-size:44px !important}
  .lpp-h2{font-size:34px !important}

  .lpp-side-pancha{max-width:220px !important}

.lpp-sub-mob{display:none}
@media (max-width: 860px){
  .lpp-tourbar{left:auto !important;right:10px;top:78px !important;translate:none !important;padding:3px !important;background:rgba(59,31,20,.35) !important;animation:none !important}
  .lpp-tour-label{display:none !important}
}

  .lpp-guide-inner .lpp-guide-bubble{display:none !important}

}
</style>

<body>
<div id="dc-root"></div>
<template id="dc-template">


<div class="lpp-dots" style="font-family: Nunito, system-ui, sans-serif; color: #3B1F14; background-color: #FFF4EA; width: 100%; overflow: hidden">

<!-- NAV -->
<header class="header-glass" style="position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(217,72,28,.15)">
  <div style="max-width: 1240px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <a href="#inicio" style="display: flex; align-items: center" aria-label="La Pancha Plancha, inicio"><img class="logo3d" src="assets/logo-lpp.svg" alt="La Pancha Plancha" style="height: 72px; width: auto; display: block"></a>
    <nav class="lpp-nav-links" aria-label="Principal" style="display: flex; gap: 26px; font-weight: 800; font-size: 15px">

<script type="text/x-dc-logic" id="dc-logic">
